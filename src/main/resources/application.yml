#==============================================================================
# novel-study 主配置
#
# 与环境相关的敏感信息（账号 / 密码 / 密钥 / 路径）一律用 ${占位符} 引用，
# 真实值统一放在 application-dev.yml 中。这样主配置不含任何明文密码，
# 把 dev 文件加进 .gitignore 就不会把密码提交到代码仓库。
#
# 占位符写法说明：${键名:默认值} —— 冒号后是找不到该键时的兜底值。
#==============================================================================

server:
  # 服务端口
  port: 8888

spring:
  application:
    # 应用名
    name: novel-study
  profiles:
    # 激活 dev 配置文件（即 application-dev.yml）
    active: dev
  jackson:
    generator:
      # JSON 序列化时，将所有 Number 类型的属性都转为 String 类型返回，避免前端数据精度丢失的问题。
      # 由于 Javascript 标准规定所有数字处理都应使用 64 位 IEEE 754 浮点值完成，
      # 结果是某些 64 位整数值无法准确表示（尾数只有 51 位宽）
      write-numbers-as-strings: true
  servlet:
    multipart:
      # 上传文件最大大小
      max-file-size: 5MB
  # 启用虚拟线程（JDK 21）：请求处理从"200 个固定线程池"变为"取号制"
  threads:
    virtual:
      enabled: true
  # 即使所有的用户线程（包括虚拟线程）都是守护线程的情况下，JVM 也不会立即退出，
  # Spring Boot 官方建议在开启虚拟线程时设置该属性
  main:
    keep-alive: true

  #------------------------- 数据库（连接信息在 dev 文件中）-------------------------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${novel.datasource.url}
    username: ${novel.datasource.username}
    password: ${novel.datasource.password}
  # ShardingSphere-JDBC 分库分表开关（本地关闭，shardingsphere-jdbc.yml 不生效）
  shardingsphere:
    enabled: false

  #------------------------- 缓存与中间件 -------------------------
  data:
    # Redis（远程缓存、验证码、分布式锁的底座）
    redis:
      host: ${novel.redis.host}
      port: ${novel.redis.port}
      password: ${novel.redis.password}
      database: ${novel.redis.database}
  # Elasticsearch：搜索模块双实现之一（本地关闭，走数据库搜索实现）
  elasticsearch:
    enabled: false
    uris:
      - ${ES_URI:https://localhost:9243}
    username: ${ES_USERNAME:elastic}
    password: ${ES_PASSWORD:}

  # RabbitMQ 消息队列（发布章节后通知 ES，本地关闭，AmqpMsgManager 内部会直接 return）
  amqp:
    enabled: false
  rabbitmq:
    addresses: ${novel.rabbitmq-addresses:amqp://guest:guest@localhost}
    virtual-host: novel
    template:
      retry:
        # 开启重试
        enabled: true
        # 最大重试次数
        max-attempts: 3
        # 第一次和第二次重试之间的持续时间
        initial-interval: "3s"

  #------------------------- Flyway（表结构版本管理，本项目未启用）-------------------------
  flyway:
    enabled: false
    # initialize the schema history table
    baseline-on-migrate: true

  #------------------------- Spring AI（作家端 AI 扩写/缩写）-------------------------
  ai:
    openai:
      # 密钥从 application-dev.yml 注入，不要将真实密钥提交到源码中
      api-key: ${novel.ai-api-key}
      base-url: https://api.siliconflow.cn
      chat:
        options:
          model: deepseek-ai/DeepSeek-R1-0528-Qwen3-8B

  #------------------------- Spring Boot Admin 监控客户端（本地关闭）-------------------------
  boot:
    admin:
      client:
        enabled: false
        # Spring Boot Admin 服务端注册地址
        url: http://localhost:8080
        username: ${novel.sba-username:novel}
        password: ${novel.sba-password:novel}
        instance:
          metadata:
            # SBA Client
            user.name: ${spring.security.user.name}
            user.password: ${spring.security.user.password}

  #------------------------- Spring Security（只管 actuator，业务接口走项目自己的 JWT 鉴权链）-------------------------
  security:
    user:
      name: ENDPOINT_ADMIN
      password: ${novel.endpoint-admin-password:ENDPOINT_ADMIN}
      roles: ENDPOINT_ADMIN

  #------------------------- 邮件（注册通知等，本地未配置真实邮箱）-------------------------
  mail:
    host: ${novel.mail-host:smtp.163.com}
    nickname: novel-study
    username: ${novel.mail-username:}
    password: ${novel.mail-password:}
    default-encoding: UTF-8
    port: 465
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false

# XXL-JOB 分布式定时任务（本地关闭）
xxl:
  job:
    enabled: false
    admin:
      # 调度中心部署根地址
      addresses: http://127.0.0.1:8080/xxl-job-admin
    executor:
      # 执行器心跳注册分组依据
      appname: xxl-job-executor-novel-study
      # 执行器运行日志文件存储磁盘路径
      logpath: logs/xxl-job/jobhandler
    # access token
    accessToken: ${novel.xxl-access-token:123}

# Actuator 端点管理
management:
  endpoints:
    web:
      exposure:
        # 仅公开健康检查和基本信息，避免 heapdump/env/beans/configprops/mappings 等
        # 敏感端点随同固定的源码内置凭据一起暴露
        include: health,info
  endpoint:
    logfile:
      # 启用返回日志文件内容的端点
      enabled: true
      # 外部日志文件路径
      external-file: logs/novel-study.log
  info:
    env:
      # 公开所有以 info. 开头的环境属性
      enabled: true
  health:
    rabbit:
      # 关闭 rabbitmq 的健康检查（本地没开 MQ，不关会报错）
      enabled: false
    elasticsearch:
      # 关闭 elasticsearch 的健康检查（本地没装 ES）
      enabled: false
    mail:
      # 关闭 mail 的健康检查（本地没配真实邮箱）
      enabled: false

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 把执行的 SQL 打到控制台，学习期强烈建议开
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键策略：auto=数据库自增，assign_id=雪花算法
      id-type: auto

# 日志级别（你自己的包开 debug，方便学习观察）
logging:
  level:
    io.github.hrz666.novelstudy: debug
  file:
    # 日志文件路径（配合 actuator 的 logfile 端点）
    name: logs/novel-study.log

# 接口文档总开关：dev 环境在 application-dev.yml 中开启
springdoc:
  api-docs:
    enabled: false

# Logbook 请求日志配置
logbook:
  format:
    # 输出格式
    style: http
  obfuscate:
    headers:
      # 隐藏 Authorization 头信息
      - Authorization
    parameters:
      # 隐藏密码参数
      - password

#------------------------- 项目自定义配置 -------------------------
novel:
  # 跨域配置：允许调用接口的前端来源
  cors:
    allow-origins:
      - http://localhost:1024
      - http://localhost:8080
  # JWT 签名密钥（真实值在 dev 文件中，必须不少于 32 个字符）
  jwt:
    secret: ${novel.jwt-secret}
  # XSS 攻击过滤配置
  xss:
    # 过滤开关
    enabled: true
    # 排除链接（这些路径不做 XSS 清洗）
    excludes:
      - /system/notice/*
  # 文件上传配置
  file:
    upload:
      # 上传根路径（真实值在 dev 文件中）
      path: ${novel.upload-path}
